name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build self-contained application
        shell: pwsh
        run: ./package.ps1

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MazeRunner-Windows
          path: dist/MazeRunner-Windows.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/MazeRunner-Windows.zip
          body: |
            MazeRunner — Windows game release.

            MazeRunner is a Java Swing maze game featuring procedural mazes, BFS pathfinding, gravity-based movement, portals, cracked walls, and chaser AI.

            Download `MazeRunner-Windows.zip`, extract it, and run `MazeRunner/MazeRunner.exe`.
            Java, Maven, and the JDK are bundled in the application package; end users do not need to install them separately.
